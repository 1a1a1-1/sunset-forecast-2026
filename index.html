<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>东方市晚霞预报</title>
    <style>
        :root { 
            --primary-color: #ff6b6b; 
            --bg-color: #fff5f5; 
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0; 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
        }
        
        /* 顶部标题栏 */
        header { 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); 
            padding: 20px 15px; 
            text-align: center; 
            box-shadow: 0 2px 10px rgba(255, 107, 107, 0.1);
        }
        h1 { margin: 0; color: #d63031; font-size: 1.4rem; font-weight: 700; letter-spacing: 1px; }
        
        /* 一级导航：左右滑动的观赏点 */
        .location-scroller {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 15px;
            background: #fff;
            -webkit-overflow-scrolling: touch; /* iOS顺滑滚动 */
            scrollbar-width: none; /* Firefox隐藏滚动条 */
        }
        .location-scroller::-webkit-scrollbar { display: none; /* Chrome/Safari隐藏滚动条 */ }
        
        .loc-tab {
            display: inline-block;
            padding: 8px 18px;
            margin-right: 12px;
            border-radius: 20px;
            background: #f0f0f0;
            color: #666;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .loc-tab.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
            transform: scale(1.05);
        }

        /* 二级导航：日期选择胶囊 */
        .date-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px 15px 20px;
            background: #fff;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            margin-bottom: 10px;
        }
        .date-pill {
            padding: 8px 20px;
            border-radius: 12px;
            background: #fff;
            border: 1px solid #eee;
            color: var(--text-sub);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 60px;
            text-align: center;
        }
        .date-pill.active {
            background: #fff0f0;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* 内容展示区 */
        .content-area { 
            padding: 0 15px 30px; 
            max-width: 600px; 
            margin: 0 auto;
        }
        
        /* 数据卡片设计 - 纵向堆叠，内容饱满 */
        .forecast-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 两列布局 */
            gap: 15px; /* 间距 */
        }
        
        /* 全宽项 (如描述) */
        .full-width {
            grid-column: span 2;
            border-bottom: 1px dashed #eee;
            padding-bottom: 12px;
            margin-bottom: 5px;
        }

        .data-item {
            display: flex;
            flex-direction: column; /* 上下结构 */
            justify-content: flex-start;
        }
        
        .data-label {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 6px; /* 标签和数值的间距 */
        }
        
        .data-value {
            font-size: 1.15rem; /* 字体加大 */
            font-weight: 700;
            color: #333;
            line-height: 1.2;
        }
        
        /* 特殊样式 */
        .highlight-text { color: var(--primary-color); }
        
        .level-badge { 
            display: inline-block; 
            padding: 4px 12px; 
            border-radius: 6px; 
            color: white; 
            font-size: 1rem; 
            font-weight: bold;
        }
        .level-1 { background-color: #2ecc71; } 
        .level-2 { background-color: #f1c40f; color: #333; } 
        .level-3 { background-color: #e67e22; } 
        .level-4 { background-color: #e74c3c; } 
        .level-5 { background-color: #8e44ad; }

        .empty-tip { text-align: center; color: #999; margin-top: 50px; font-size: 1rem; }
    </style>
</head>

    function init() {
        // 渲染地点 tabs
        locations.forEach((loc, index) => {
            const tab = document.createElement('div');
            tab.className = `loc-tab ${index === 0 ? 'active' : ''}`;
            tab.innerText = loc;
            tab.onclick = () => switchLocation(loc, tab);
            locContainer.appendChild(tab);
        });

        renderDates();
        renderData();
    }

        currentLoc = newLoc;
        // 更新 Tab 样式
        document.querySelectorAll('.loc-tab').forEach(t => t.classList.remove('active'));
        tabElement.classList.add('active');
        renderData();
    }

    function renderDates() {
        dateContainer.innerHTML = '';
        datesRaw.forEach((date, index) => {

            pill.className = `date-pill ${date === currentDate ? 'active' : ''}`;
            pill.innerText = datesDisplay[index]; // 使用格式化后的 "7月30日"
            pill.onclick = () => switchDate(date, pill);
            dateContainer.appendChild(pill);
        });

    }

                    <div><span class="level-badge ${levelClass}">${item['晚霞等级']} 级</span></div>
                </div>
                <div class="data-item">
                    <span class="data-label">出现概率</span>
                    <span class="data-value highlight-text">${item['出现概率']}%</span>
                </div>

                <!-- 第三行：日落时间 & 预计开始 -->
                <div class="data-item">
                    <span class="data-label">日落时间</span>
                    <span class="data-value">${item['日落时间'] || '--:--'}</span>
                </div>
                <div class="data-item">
                    <span class="data-label">预计开始</span>
                    <span class="data-value">${item['预计开始时间'] || '--:--'}</span>
                </div>

                <!-- 第四行：预计结束 (单独一行或补位，这里为了平衡放左边，右边留空或放其他) -->
                <div class="data-item">
                    <span class="data-label">预计结束</span>
                    <span class="data-value">${item['预计结束时间'] || '--:--'}</span>
                </div>
            </div>`;
        });

        resultArea.innerHTML = html;
    }

    // 启动
    init();
</script>

</body>
</html>
